<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介ホームページ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
        }

        section {
            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #333;
        }

        footer {
            text-align: center;
            background: #333;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>ホームページ</h1>
    <p>大学生の自己紹介サイト</p>
</header>

<div class="container">

    <section>
        <h2>自己紹介</h2>
        <p>こんにちは。獨協大学経済学部経済学科の三溝遼大です。</p>
    </section>

    <section>
        <h2>趣味</h2>
        <ul>
            <li>音楽を聴くこと</li>
            <li>ギターを弾くこと</li>
            <li>アニメ、ドラマを見ること</li>
        </ul>
    </section>

    <section>
        <h2>大学で学んでいること</h2>
        <p>教育、経済などについて学んでいます。</p>
    </section>

    <section>
        <h2>今後の目標</h2>
        <p>就活で行きたい業界にいく。</p>
        <p>さっさと内定もらうこと</p>
    </section>

</div>

<footer>
    <p>© 2026 My Website</p>
</footer>

</body>
</html>
