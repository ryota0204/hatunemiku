<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Homepage</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#ffffff;
    color:#111;
    line-height:1.8;
}

/* ヘッダー */
header{
    background:#111;
    color:#fff;
    text-align:center;
    padding:80px 20px;
}

header h1{
    font-size:42px;
    margin-bottom:10px;
}

header p{
    font-size:18px;
    color:#d1d1d1;
}

/* 全体 */
.container{
    width:90%;
    max-width:900px;
    margin:50px auto;
}

/* カード */
.card{
    border:1px solid #ddd;
    border-radius:12px;
    padding:35px;
    margin-bottom:25px;
    background:#fff;
}

/* 見出し */
h2{
    margin-bottom:20px;
    border-bottom:2px solid #111;
    display:inline-block;
    padding-bottom:5px;
}

/* 写真 */
.profile-image{
    width:260px;
    display:block;
    margin:25px auto;
    border-radius:10px;
    border:2px solid #111;
}

/* 趣味 */
.hobby-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.hobby{
    border:1px solid #111;
    padding:10px 18px;
    border-radius:20px;
}

/* フッター */
footer{
    background:#111;
    color:#fff;
    text-align:center;
    padding:20px;
    margin-top:50px;
}
</style>
</head>

<body>

<header>
    <h1>ホームページ</h1>
    <p>お試しサイト</p>
</header>

<div class="container">

    <div class="card">
        <h2>自己紹介</h2>

        <!-- photo.jpg -->
        <img src="photo.jpg" alt="プロフィール画像" class="profile-image">

        <p>
            大学で学びながら、日々新しいことに挑戦しています。<br>
            簡単な自己紹介をしています。
        </p>
    </div>

    <div class="card">
        <h2>趣味</h2>

        <div class="hobby-list">
            <div class="hobby">ゲームすること</div>
            <div class="hobby">小説を読むこと</div>
            <div class="hobby">音楽を聴くこと</div>
        </div>
    </div>

    <div class="card">
        <h2>メッセージ</h2>

        <p>
            とりあえずなんでもいいので内定ください。行きたい業界に行かせてください。
        </p>
    </div>

</div>

<footer>
    © 2026 My Homepage
</footer>

</body>
</html>
